services:
  mysql:
    image: mysql:8.0
    container_name: ecom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${SHOP_DB}
    ports:
      - "${MYSQL_PORT_HOST}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_HOST}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  shop-backend:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: ecom-shop-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./shop-backend:/var/www/html
      - shop_vendor:/var/www/html/vendor
      - shop_runtime:/var/www/html/runtime
    environment:
      - APP_NAME=shop-backend
      - DB_DATABASE=${SHOP_DB}
    env_file:
      - .env
    ports:
      - "${SHOP_BACKEND_PORT}:80"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  pim-backend:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: ecom-pim-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./pim-backend:/var/www/html
      - pim_vendor:/var/www/html/vendor
      - pim_runtime:/var/www/html/runtime
    environment:
      - APP_NAME=pim-backend
      - DB_DATABASE=${PIM_DB}
    env_file:
      - .env
    ports:
      - "${PIM_BACKEND_PORT}:80"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  oms-backend:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: ecom-oms-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./oms-backend:/var/www/html
      - oms_vendor:/var/www/html/vendor
      - oms_runtime:/var/www/html/runtime
      - ./oms-backend/supervisor/consumer.conf:/etc/supervisor/conf.d/consumer.conf:ro
    environment:
      - APP_NAME=oms-backend
      - DB_DATABASE=${OMS_DB}
    env_file:
      - .env
    ports:
      - "${OMS_BACKEND_PORT}:80"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  wms-backend:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: ecom-wms-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./wms-backend:/var/www/html
      - wms_vendor:/var/www/html/vendor
      - wms_runtime:/var/www/html/runtime
      - ./wms-backend/supervisor/consumer.conf:/etc/supervisor/conf.d/consumer.conf:ro
    environment:
      - APP_NAME=wms-backend
      - DB_DATABASE=${WMS_DB}
    env_file:
      - .env
    ports:
      - "${WMS_BACKEND_PORT}:80"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  shop_vendor:
  shop_runtime:
  pim_vendor:
  pim_runtime:
  oms_vendor:
  oms_runtime:
  wms_vendor:
  wms_runtime:
