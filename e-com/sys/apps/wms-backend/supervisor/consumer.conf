; WMS 容器内的 consumer 进程
; docker-compose 把此文件 mount 到 /etc/supervisor/conf.d/consumer.conf
[program:consume-oms]
command=php /var/www/html/think consume:oms
directory=/var/www/html
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

