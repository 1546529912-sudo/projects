# Web 容器内的 Nginx 配置
# 对外提供静态文件 + 把 /api/v1 反向代理到 api 容器

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 允许较大上传（与 multer 限制保持一致）
    client_max_body_size 50M;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # SPA 前端路由：所有未命中的路径都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理：转发到 api 容器（容器内可通过服务名 api 解析）
    location /api/v1/ {
        proxy_pass http://api:3001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 上传文件代理：后端 NestJS 用 useStaticAssets 暴露的 /uploads
    location /uploads/ {
        proxy_pass http://api:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 静态资源长缓存（Vite 构建产物带 hash 文件名，可安全长缓存）
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 隐藏服务器版本
    server_tokens off;
}
