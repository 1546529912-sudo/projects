<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img" aria-labelledby="title desc">
  <title id="title">Pencil Multi-Platform Product Design Agent Skill v2.2</title>
  <desc id="desc">English infographic explaining what the skill is, what it can design, its core upgrades, workflow, value, and one-line summary.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .font { font-family: Inter, Arial, Helvetica, sans-serif; }
      .title { font-size: 58px; font-weight: 850; fill: #0b1736; }
      .subtitle { font-size: 30px; fill: #475569; }
      .section-title { font-size: 34px; font-weight: 820; fill: #0f4fa8; }
      .body { font-size: 24px; fill: #1f2937; }
      .small { font-size: 20px; fill: #475569; }
      .label { font-size: 24px; font-weight: 760; fill: #111827; }
      .num { font-size: 36px; font-weight: 850; fill: #ffffff; }
      .icon { font-size: 52px; }
    </style>
  </defs>

  <rect width="1600" height="2000" fill="#eef6ff"/>
  <rect x="40" y="34" width="1520" height="1908" rx="28" fill="#ffffff" filter="url(#shadow)"/>

  <text x="210" y="118" class="font title">Pencil Multi-Platform Product Design Skill</text>
  <text x="1382" y="118" class="font" font-size="42" font-weight="850" fill="#1b76e5">v2.2</text>
  <text x="214" y="166" class="font subtitle">A repeatable way for AI to create stable, editable product designs on Pencil canvases.</text>
  <g transform="translate(72 64)">
    <rect x="0" y="52" width="82" height="22" rx="11" fill="#2f80ed" transform="rotate(-34 41 63)"/>
    <rect x="35" y="14" width="48" height="112" rx="12" fill="#38bdf8" transform="rotate(34 59 70)"/>
    <rect x="44" y="24" width="26" height="86" rx="6" fill="#2563eb" transform="rotate(34 57 67)"/>
    <path d="M11 142 C52 118, 94 120, 134 144" fill="none" stroke="#2f80ed" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g transform="translate(70 232)">
    <rect width="560" height="510" rx="18" fill="#f8fbff" stroke="#d8e4f3" stroke-width="2"/>
    <rect x="26" y="26" width="58" height="58" rx="12" fill="#1b76e5"/><text x="45" y="68" class="font num">1</text>
    <text x="108" y="67" class="font section-title">What is it?</text>
    <g transform="translate(32 118)">
      <rect width="496" height="340" rx="18" fill="#ffffff" stroke="#dbe6f3"/>
      <text x="38" y="74" class="font icon" fill="#2563eb">?</text>
      <text x="128" y="54" class="font body">Not a generic drawing prompt.</text>
      <text x="128" y="91" class="font body">It is a design-agent skill for Pencil.</text>
      <line x1="28" y1="132" x2="468" y2="132" stroke="#edf2f7"/>
      <text x="38" y="202" class="font icon" fill="#14b8a6">◆</text>
      <text x="128" y="175" class="font body">Creates editable, reusable,</text>
      <text x="128" y="212" class="font body">handoff-ready canvas drafts</text>
      <text x="128" y="249" class="font body">through Pencil MCP / IDE tools.</text>
      <line x1="28" y1="278" x2="468" y2="278" stroke="#edf2f7"/>
      <text x="38" y="326" class="font icon" fill="#6366f1">&lt;/&gt;</text>
      <text x="128" y="321" class="font body">Works with Claude, Codex, Cursor,</text>
      <text x="128" y="358" class="font body">VS Code, and similar agent workflows.</text>
    </g>
  </g>

  <g transform="translate(660 232)">
    <rect width="870" height="510" rx="18" fill="#f8fbff" stroke="#d8e4f3" stroke-width="2"/>
    <rect x="26" y="26" width="58" height="58" rx="12" fill="#0ea5b7"/><text x="45" y="68" class="font num">2</text>
    <text x="108" y="67" class="font section-title">What can it design?</text>
    <circle cx="435" cy="270" r="100" fill="#22c7b8"/>
    <text x="380" y="254" class="font" font-size="32" font-weight="850" fill="#ffffff">Multi-</text>
    <text x="360" y="298" class="font" font-size="32" font-weight="850" fill="#ffffff">platform</text>
    <g class="font body">
      <rect x="34" y="126" width="270" height="72" rx="14" fill="#ffffff" stroke="#dbe6f3"/><text x="74" y="172">Web Admin</text>
      <rect x="34" y="226" width="270" height="72" rx="14" fill="#ffffff" stroke="#dbe6f3"/><text x="74" y="272">Landing Page</text>
      <rect x="34" y="326" width="270" height="72" rx="14" fill="#ffffff" stroke="#dbe6f3"/><text x="74" y="372">Mobile App</text>
      <rect x="566" y="126" width="270" height="72" rx="14" fill="#ffffff" stroke="#dbe6f3"/><text x="606" y="172">Big Screen</text>
      <rect x="566" y="226" width="270" height="72" rx="14" fill="#ffffff" stroke="#dbe6f3"/><text x="606" y="272">E-commerce</text>
      <rect x="566" y="326" width="270" height="72" rx="14" fill="#ffffff" stroke="#dbe6f3"/><text x="606" y="372">Deck / Slides</text>
    </g>
    <g stroke="#0ea5b7" stroke-width="2" opacity="0.75">
      <line x1="304" y1="162" x2="340" y2="225"/><line x1="304" y1="262" x2="335" y2="270"/><line x1="304" y1="362" x2="340" y2="315"/>
      <line x1="566" y1="162" x2="530" y2="225"/><line x1="566" y1="262" x2="535" y2="270"/><line x1="566" y1="362" x2="530" y2="315"/>
    </g>
  </g>

  <g transform="translate(70 780)">
    <rect width="1460" height="360" rx="18" fill="#f8fbff" stroke="#d8e4f3" stroke-width="2"/>
    <rect x="26" y="26" width="58" height="58" rx="12" fill="#1b76e5"/><text x="45" y="68" class="font num">3</text>
    <text x="108" y="67" class="font section-title">Core upgrades</text>
    <g transform="translate(28 116)">
      <g>
        <rect width="260" height="190" rx="16" fill="#ffffff" stroke="#dbe6f3"/>
        <text x="104" y="72" class="font icon" fill="#2563eb">?</text>
        <text x="48" y="122" class="font label">Intake Gate</text>
        <text x="38" y="158" class="font small">Ask key questions before drawing.</text>
      </g>
      <g transform="translate(286 0)">
        <rect width="260" height="190" rx="16" fill="#ffffff" stroke="#dbe6f3"/>
        <text x="102" y="72" class="font icon" fill="#14b8a6">⌘</text>
        <text x="54" y="122" class="font label">Mode Routing</text>
        <text x="34" y="158" class="font small">Choose the right design mode.</text>
      </g>
      <g transform="translate(572 0)">
        <rect width="260" height="190" rx="16" fill="#ffffff" stroke="#dbe6f3"/>
        <text x="98" y="72" class="font icon" fill="#2563eb">▦</text>
        <text x="42" y="122" class="font label">Canvas Rules</text>
        <text x="30" y="158" class="font small">Pages, frames, variables, states.</text>
      </g>
      <g transform="translate(858 0)">
        <rect width="260" height="190" rx="16" fill="#ffffff" stroke="#dbe6f3"/>
        <text x="104" y="72" class="font icon" fill="#0ea5b7">▣</text>
        <text x="46" y="122" class="font label">Safe batch_design</text>
        <text x="26" y="158" class="font small">Avoid broken refs and rollback risk.</text>
      </g>
      <g transform="translate(1144 0)">
        <rect width="260" height="190" rx="16" fill="#ffffff" stroke="#dbe6f3"/>
        <text x="104" y="72" class="font icon" fill="#7c3aed">✓</text>
        <text x="48" y="122" class="font label">QA Loop</text>
        <text x="32" y="158" class="font small">Check layout, layers, states.</text>
      </g>
    </g>
  </g>

  <g transform="translate(70 1178)">
    <rect width="1460" height="320" rx="18" fill="#f8fbff" stroke="#d8e4f3" stroke-width="2"/>
    <rect x="26" y="26" width="58" height="58" rx="12" fill="#1b76e5"/><text x="45" y="68" class="font num">4</text>
    <text x="108" y="67" class="font section-title">How does it work?</text>
    <g transform="translate(82 130)" class="font small" text-anchor="middle">
      <circle cx="0" cy="0" r="48" fill="#e0f2fe" stroke="#38bdf8" stroke-width="4"/><text x="0" y="8" font-size="34" fill="#2563eb">⌕</text><text x="0" y="88">Host check</text>
      <text x="150" y="10" font-size="42" fill="#64748b">→</text>
      <circle cx="290" cy="0" r="48" fill="#ccfbf1" stroke="#14b8a6" stroke-width="4"/><text x="290" y="8" font-size="34" fill="#0f766e">?</text><text x="290" y="88">Clarify</text>
      <text x="440" y="10" font-size="42" fill="#64748b">→</text>
      <circle cx="580" cy="0" r="48" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/><text x="580" y="8" font-size="34" fill="#16a34a">↱</text><text x="580" y="88">Route mode</text>
      <text x="730" y="10" font-size="42" fill="#64748b">→</text>
      <circle cx="870" cy="0" r="48" fill="#fef3c7" stroke="#f59e0b" stroke-width="4"/><text x="870" y="8" font-size="34" fill="#d97706">□</text><text x="870" y="88">Read context</text>
      <text x="1020" y="10" font-size="42" fill="#64748b">→</text>
      <circle cx="1160" cy="0" r="48" fill="#ede9fe" stroke="#8b5cf6" stroke-width="4"/><text x="1160" y="8" font-size="34" fill="#7c3aed">✎</text><text x="1160" y="88">Generate</text>
      <text x="1310" y="10" font-size="42" fill="#64748b">→</text>
      <circle cx="1450" cy="0" r="48" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/><text x="1450" y="8" font-size="34" fill="#2563eb">✓</text><text x="1450" y="88">Verify</text>
    </g>
    <rect x="430" y="252" width="700" height="44" rx="22" fill="#edf7ff" stroke="#b8d8f5"/>
    <text x="500" y="283" class="font" font-size="24" font-weight="760" fill="#0f4fa8">Key point: never start drawing when the brief is unclear.</text>
  </g>

  <g transform="translate(70 1534)">
    <rect width="700" height="300" rx="18" fill="#f8fbff" stroke="#d8e4f3" stroke-width="2"/>
    <rect x="26" y="26" width="58" height="58" rx="12" fill="#1b76e5"/><text x="45" y="68" class="font num">5</text>
    <text x="108" y="67" class="font section-title">Why is it useful?</text>
    <g class="font small" text-anchor="middle">
      <text x="118" y="142" font-size="44" fill="#14b8a6">●</text><text x="118" y="188">Helps non-designers</text><text x="118" y="222">start safely</text>
      <text x="276" y="142" font-size="44" fill="#2563eb">●</text><text x="276" y="188">Gives professionals</text><text x="276" y="222">more stable output</text>
      <text x="444" y="142" font-size="44" fill="#7c3aed">●</text><text x="444" y="188">Fits multi-platform</text><text x="444" y="222">consistency projects</text>
      <text x="604" y="142" font-size="44" fill="#f97316">●</text><text x="604" y="188">More controllable</text><text x="604" y="222">than a single prompt</text>
    </g>
  </g>

  <g transform="translate(810 1534)">
    <rect width="720" height="300" rx="18" fill="#f8fbff" stroke="#d8e4f3" stroke-width="2"/>
    <rect x="26" y="26" width="58" height="58" rx="12" fill="#1b76e5"/><text x="45" y="68" class="font num">6</text>
    <text x="108" y="67" class="font section-title">One-line summary</text>
    <rect x="46" y="114" width="628" height="132" rx="20" fill="#eef7ff" stroke="#b9d7f4"/>
    <text x="76" y="162" class="font body">It adds a product design brain and Pencil</text>
    <text x="76" y="201" class="font body">canvas execution rules to AI, so the agent</text>
    <text x="76" y="240" class="font body">clarifies, routes, generates, and verifies.</text>
  </g>

  <text x="130" y="1908" class="font" font-size="24" fill="#475569">Best for product managers, UI designers, e-commerce designers, and developers using Claude / Codex / Cursor.</text>
</svg>
