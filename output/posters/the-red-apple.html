<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      html,
      body {
        margin: 0;
        width: 750px;
        height: 420px;
        overflow: hidden;
        background: #fff8ee;
      }

      svg {
        display: block;
        width: 750px;
        height: 420px;
      }
    </style>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" width="750" height="420" viewBox="0 0 750 420">
      <defs>
        <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff8ee"/>
          <stop offset="1" stop-color="#f8eee5"/>
        </linearGradient>
        <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fffdf7"/>
          <stop offset="1" stop-color="#fff4e7"/>
        </linearGradient>
        <linearGradient id="apple" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff927f"/>
          <stop offset=".55" stop-color="#ef665a"/>
          <stop offset="1" stop-color="#dc4d48"/>
        </linearGradient>
        <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#bfe5ad"/>
          <stop offset="1" stop-color="#82c990"/>
        </linearGradient>
        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
          <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#b88968" flood-opacity=".12"/>
        </filter>
        <filter id="tinyShadow" x="-25%" y="-25%" width="150%" height="150%">
          <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#b88968" flood-opacity=".12"/>
        </filter>
      </defs>
      <rect width="750" height="420" fill="url(#paper)"/>
      <ellipse cx="120" cy="74" rx="186" ry="78" fill="#ffffff" opacity=".55"/>
      <ellipse cx="640" cy="350" rx="210" ry="86" fill="#ffe4c2" opacity=".34"/>
      <ellipse cx="648" cy="82" rx="126" ry="52" fill="#ffe9c9" opacity=".35"/>
      <g transform="translate(72 36)">
        <rect x="0" y="0" width="606" height="348" rx="34" fill="url(#card)" filter="url(#softShadow)"/>
        <rect x="22" y="20" width="562" height="308" rx="26" fill="#fffdf8" opacity=".76"/>
        <g transform="translate(303 228) scale(.72)">
          <ellipse cx="0" cy="105" rx="116" ry="22" fill="#e7cbb9" opacity=".22"/>
          <path d="M-34 -86 C-18 -126 20 -124 14 -78 C28 -123 72 -113 72 -76" fill="none" stroke="#8b603d" stroke-width="9" stroke-linecap="round"/>
          <path d="M-84 -28 C-88 -74 -54 -104 -16 -86 C-6 -98 8 -98 18 -86 C56 -105 90 -74 84 -28 C78 48 38 98 0 96 C-38 98 -78 48 -84 -28Z" fill="url(#apple)"/>
          <ellipse cx="-30" cy="-12" rx="54" ry="75" fill="#ff8b77" opacity=".72"/>
          <ellipse cx="34" cy="-8" rx="48" ry="72" fill="#df554f" opacity=".45"/>
          <ellipse cx="-28" cy="-44" rx="16" ry="28" fill="#ffd8b5" opacity=".48"/>
          <path d="M24 -96 C60 -130 104 -102 88 -72 C58 -69 36 -76 24 -96Z" fill="url(#leaf)"/>
          <path d="M39 -93 C55 -91 67 -86 82 -76" fill="none" stroke="#6eb77f" stroke-width="4" stroke-linecap="round" opacity=".46"/>
          <circle cx="-20" cy="6" r="7" fill="#3d3938"/>
          <circle cx="24" cy="6" r="7" fill="#3d3938"/>
          <circle cx="-22" cy="3" r="2.2" fill="#fff8ee"/>
          <circle cx="22" cy="3" r="2.2" fill="#fff8ee"/>
          <path d="M-18 36 Q0 50 20 36" fill="none" stroke="#6b4642" stroke-width="5" stroke-linecap="round"/>
          <circle cx="-46" cy="27" r="11" fill="#ffb3a3" opacity=".42"/>
          <circle cx="50" cy="27" r="11" fill="#ffb3a3" opacity=".32"/>
        </g>
        <g transform="translate(303 42)" text-anchor="middle">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="0" fill="#cc7d62">PICTURE BOOK</text>
          <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', Arial, sans-serif" font-size="43" font-weight="900" letter-spacing="0" fill="#303236">The Red Apple</text>
          <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0" fill="#a18f83">A warm first English story</text>
        </g>
        <g transform="translate(450 38)" filter="url(#tinyShadow)">
          <rect x="0" y="0" width="112" height="34" rx="17" fill="#fffaf3"/>
          <circle cx="20" cy="17" r="6" fill="#ef665a"/>
          <text x="40" y="22" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="800" fill="#8c7b70">L1 Seed</text>
        </g>
      </g>
    </svg>
  </body>
</html>
